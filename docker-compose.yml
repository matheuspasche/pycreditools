services:
  ralph_loop:
    build:
      context: ./docker
      args:
        # ralph must share the host user's uid/gid or it cannot write the bind-mounted
        # tree. Defaults cover the common case; override in .env on a host that is not 1000.
        RALPH_UID: "${RALPH_UID:-1000}"
        RALPH_GID: "${RALPH_GID:-1000}"
    env_file:
      - .env
    volumes:
      - .:/workspace
      - claude_home:/home/ralph/.claude
    # on-failure (not unless-stopped): the loop exits 0 when it cleanly stops for a
    # human (all done / blocked / BLOCKED / ERROR). unless-stopped would relaunch it
    # on that clean exit -> an infinite restart cycle. on-failure only relaunches on a
    # real crash (non-zero exit); a clean stop stays stopped for the human.
    restart: on-failure

  # The v3 PAIR loop for the v0.6 engine map: one session implements, a separate fresh
  # session audits, they argue to agreement, then the loop pushes / opens / merges the PR
  # against release/v0.6. Same image as the v1 loop, different entrypoint — the script and
  # the prompt templates are read from the bind-mounted tree, so editing a prompt needs no
  # rebuild. Behind a profile so a bare `docker compose up` never starts both loops:
  #   docker compose --profile v06 up -d --build ralph_v06
  ralph_v06:
    profiles: ["v06"]
    build:
      context: ./docker
      args:
        # ralph must share the host user's uid/gid or it cannot write the bind-mounted
        # tree. Defaults cover the common case; override in .env on a host that is not 1000.
        RALPH_UID: "${RALPH_UID:-1000}"
        RALPH_GID: "${RALPH_GID:-1000}"
    env_file:
      - .env
    environment:
      BASE_BRANCH: release/v0.6
      QUEUE_LABEL: ready-for-agent
      PARENT_ISSUE: "156"
      MAP_ISSUE: "111"
      CLAUDE_MODEL: claude-opus-5
      CLAUDE_EFFORT: medium
      # MAX_ROUNDS, CONTEXT_CAP_TOKENS e as politicas novas (janela, teto de uso,
      # prioridades do ntfy) moram no .env: `environment:` VENCE o env_file, entao deixa-las
      # aqui tornaria o .env decorativo — e o .env e o arquivo que o dono edita com o loop
      # no ar. Ver .env.example. Os defaults de verdade estao no proprio script.
      # Ticket 13 (#160) declares no blocker, so the lowest-number queue rule would pull it
      # second — but the tickets doc rules it "barato, fica onde esta, e nao compete por
      # prioridade no dia zero": tests/studio stays green through tickets 1-15 and the only
      # thing #160 unblocks is ticket 16 (#172). Skipped until the queue reaches the
      # contraction; drop it from this list then, or #172 deadlocks the queue.
      SKIP_ISSUES: "160"
    # The loop checks out a ticket branch in the SAME bind-mounted tree, so the script and
    # the prompt templates would vanish from under the running process the moment it left
    # a branch that carries them. Copy both OUT of the tree at startup and run from there:
    # the loop becomes indifferent to which branch the working tree is on, and editing a
    # prompt still needs no rebuild (just a restart, which re-copies).
    entrypoint:
      - bash
      - -c
      - |
        set -e
        mkdir -p "$$HOME/loop"
        cp /workspace/docker/ralph_loop_v06.sh "$$HOME/loop/"
        cp -r /workspace/docker/prompts "$$HOME/loop/prompts"
        export PROMPT_DIR="$$HOME/loop/prompts"
        # O venv do GATE, e ele tem que ser construido por ESTE interpretador. O
        # .venv-linux da arvore e do Python do host (3.14 no Fedora) e seu site-packages
        # e ilegivel para o 3.11 daqui: com ele, `pytest` morria com ModuleNotFoundError
        # em TODO ticket e o loop recusaria ate o trabalho correto. Vive num volume
        # nomeado, entao e construido uma vez e sobrevive a recriacao do container.
        export VENV="$${VENV:-/home/ralph/venv}"
        if [ ! -x "$$VENV/bin/python" ]; then
          echo "[entrypoint] construindo o venv do gate em $$VENV (so na primeira vez)"
          python3 -m venv "$$VENV"
          "$$VENV/bin/pip" install -q --upgrade pip
          "$$VENV/bin/pip" install -q -e "/workspace[dev,all]" || {
            echo "[entrypoint] FALHA ao instalar as dependencias no venv"; exit 1; }
        fi
        exec bash "$$HOME/loop/ralph_loop_v06.sh"
    volumes:
      - .:/workspace
      - claude_home_v06:/home/ralph/.claude
      - ralph_venv_v06:/home/ralph/venv
    restart: on-failure

volumes:
  claude_home:
  claude_home_v06:
  ralph_venv_v06:
